<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#517A37">
<title>Pedido enviado · Greens Market</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#F4F6EE;--ink:#132018;--muted:#5B6B60;--leaf:#517A37;--leaf-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1511;--ink:#E8F0EA;--muted:#93A399;--leaf:#A8BE38;--leaf-ink:#172006;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px 16px;box-sizing:border-box}
img{height:52px}.dk{display:none}
@media (prefers-color-scheme:dark){.lt{display:none}.dk{display:inline}}
.ok{width:72px;height:72px;border-radius:999px;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;margin:28px auto 8px}
.ok svg{width:40px;height:40px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.7rem;margin:8px 0}
p{color:var(--muted);margin:0 auto;max-width:340px;line-height:1.45}
</style>
</head>
<body>
<main>
  <img class="lt" src="logo.png" alt="Greens Market"><img class="dk" src="logo-dark.png" alt="Greens Market">
  <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>¡Pedido enviado!</h1>
  <p>Greens Market ya recibió el pedido alistado con los pesos. Muchas gracias.</p>
</main>
</body>
</html>
